<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squall</title>
<link rel="stylesheet" href="app.css?v=2026.10.25.1724">
<link rel="stylesheet" href="anims.css?v=2026.10.26.groky2">
<link rel="stylesheet" href="features.css?v=2026.10.26.groky2">
<link rel="stylesheet" href="vault.css?v=2026.10.26.groky2">
<link rel="stylesheet" href="usage.css?v=2026.10.26.groky2">
<link rel="stylesheet" href="team.css?v=2026.10.29.groky229">
<link rel="stylesheet" href="uno.css?v=2026.11.25.uno1">
</head>
<body>
<div id="app">
  <aside id="team" class="glass">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" width="20" height="20" fill="#fff"><path d="M13.2 2 5 13.4h5.6L9.4 22l8.6-12h-5.7z"/></svg></div>
      <div><div class="brand-name">Squall</div><div class="brand-sub">Storm's AI team</div></div>
      <button class="icon-btn" id="btn-updates" data-act="updates" title="Update log: what changed in each update"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg></button>
      <button class="icon-btn" id="btn-settings" data-act="settings" title="Settings: model, timer, live mode, sessions, workspace"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
    <div id="agents"></div>
    <button id="strip-switch" title="Switch chat" aria-haspopup="true" aria-expanded="false"></button>
    <button id="strip-live" title="Live: the right pane as a drawer">Live</button>
  </aside>
  <main id="center" class="glass">
    <div class="chat-glow"></div>
    <div id="chat-head"></div>
    <div id="banner" class="banner hidden"></div>
    <div id="find" class="find-bar hidden" role="search"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="find-q" type="text" placeholder="Find in this chat" spellcheck="false" autocomplete="off"><span id="find-n"></span><button data-find="prev" title="Older match (Enter)">↑</button><button data-find="next" title="Newer match (Shift+Enter)">↓</button><button data-find="close" title="Close (Esc)">×</button></div>
    <div id="panes"><div class="pcol" id="pcol1"><div id="chat" class="pane"></div></div><div class="pcol" id="pcol2" hidden><div id="chat2" class="pane"></div><div id="composer2" class="composer2"><div class="input-row"><textarea id="input2" rows="1" placeholder="Message…" spellcheck="true"></textarea><button id="send2" class="primary" title="Send (Enter)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg></button></div></div></div></div>
    <button id="jump" class="jump hidden" title="Jump to the newest messages">↓ New messages</button>
    <div id="composer">
      <div id="targets"></div>
      <div id="attach" class="attach hidden"></div>
      <div class="input-row">
        <textarea id="input" rows="1" placeholder="Give the team a goal…" spellcheck="true"></textarea>
        <button id="send" class="primary" title="Send (Enter)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
        <button id="stop" class="danger hidden" title="Stop every agent"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
      </div>
      <div class="under-row"><button id="timer" class="timer-chip off" data-act="timer" title="How long Claude works on what you send"></button><button id="ctx" class="ctx-btn" data-act="ctx" title="Session context and compacting"></button><button id="model" class="timer-chip model-chip" data-act="model" title="Model for Squall’s agents"></button><button id="judge" class="timer-chip judge-chip" data-act="judge" title="Judge: Haiku checks each teammate’s reply at the end of its turn and sends it back once if it isn’t good enough"></button><div class="hint" id="hint">Enter to send · Shift+Enter for a new line</div><button id="usage" class="usage-chip" data-act="usage" title="Plan usage"></button><span id="awake" class="awake-chip hidden" title="Keeping this PC awake while the team works (closing the lid on battery still sleeps)">Awake</span><button id="voice" class="voice-btn" data-act="voice" title="Dictation: talk, and it types into the box"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button><button id="call" class="voice-btn" data-act="call" title="Voice call: talk hands-free, and the replies show on screen"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg></button></div>
    </div>
  </main>
  <aside id="live" class="glass">
    <div class="live-head"><div id="live-tabs"></div></div>
    <div id="live-body"></div>
    <div id="live-foot"></div>
  </aside>
</div>
<script>
  // report script errors to Squall's log, even when app.js breaks before its own error handlers are set up
  // (once app.js is running it sets window.squallReady and reports its own errors, so each error is logged once)
  window.addEventListener('error', function (e) { if (window.squallReady) return; try { window.chrome.webview.postMessage({ id: 999999, cmd: 'log', args: { level: 'error', msg: String(e.message) + ' @' + String(e.filename || '').split('/').pop() + ':' + e.lineno + ':' + e.colno } }); } catch (x) { } });
</script>
<script src="markdown.js?v=2026.10.29.groky229.js"></script>
<script src="link.js?v=2026.11.15.link1.js"></script>
<script src="uno.js?v=2026.11.25.uno1.js"></script>
<script src="app.js?v=2026.10.28.groky227.js"></script>
</body>
</html>
