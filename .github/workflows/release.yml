# Builds Squall and publishes a GitHub Release, which every Squall picks up with its auto-updater.
# Two ways to start it:
#   1. Push a tag like v1.4.0 (git tag v1.4.0 && git push origin v1.4.0). A tag like v1.5.0-beta.1 makes a beta
#      (a pre-release), which normal Squall skips.
#   2. On GitHub: Actions > Release > Run workflow, type the version (like 1.4.0) and press Run.
# The release has Squall-win-x64.zip (Squall.exe, SquallSwap.exe and web/) and Squall-win-x64.zip.sha256, which Squall
# checks before it installs anything. It needs host/Squall.csproj (Squall's C# host) in the repo; until that is pushed
# the build stops with a message saying so.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, like 1.4.0 (or 1.5.0-beta.1 for a beta)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Work out the version
        id: ver
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $raw = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_VERSION } else { $env:REF_NAME }
          $v = $raw.Trim().TrimStart('v', 'V')
          if ($v -notmatch '^\d+\.\d+(\.\d+)?(-[0-9A-Za-z.-]+)?$') { throw "'$raw' isn't a version like 1.4.0" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($v.Contains('-')) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing v$v"

      - name: Test the phone link and updater first
        run: dotnet test SquallLink.sln -c Release

      - name: Build Squall and zip it
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: ./Build-Release.ps1 -Version $env:VERSION

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Squall ${{ steps.ver.outputs.tag }}
          prerelease: ${{ steps.ver.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/Squall-win-x64.zip
            dist/Squall-win-x64.zip.sha256
